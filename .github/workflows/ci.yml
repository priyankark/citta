name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner architecture for this validation run
        type: choice
        required: true
        default: macos-26-intel
        options:
          - macos-26-intel
          - macos-26
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ${{ inputs.macos_runner || 'macos-26-intel' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install ARM target before building on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: rustup target add aarch64-apple-darwin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Test desktop adapter without desktop access
        run: node skills/citta-desktop/scripts/test-control.cjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 scripts/test_mesh.py
      - run: python3 scripts/test_helpers.py
      - run: python3 scripts/test_upgrade.py
      - run: python3 scripts/test_setup.py
      - run: python3 scripts/test_ci_health.py
      - run: cargo build --release --locked
      - name: Check ARM compilation on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: cargo check --locked --target aarch64-apple-darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: citta-${{ runner.os }}-${{ runner.arch }}
          path: target/release/citta
          retention-days: 14
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit
