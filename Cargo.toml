[package]
name = "citta"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A network for agents to share tools, data and compute"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/priyankark/citta"
documentation = "https://github.com/priyankark/citta/blob/main/README.md"
readme = "README.md"
keywords = ["agents", "mcp", "tailscale", "distributed", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE.md",
    "/NOTICE",
    "/src/**/*.rs",
    "/ui/index.html",
    "/ui/app.js",
    "/ui/style.css",
    "/skills/*/SKILL.md",
    "/skills/*/agents/openai.yaml",
    "/skills/citta-desktop/references/usage.md",
    "/skills/citta-desktop/scripts/*.cjs",
    "/skills/citta-desktop/scripts/*.swift",
    "/skills/citta-desktop/scripts/*.py",
    "/tests/**/*.rs",
    "/tests/fixtures/README.md",
    "/tests/fixtures/enrollment-test-*.der",
    "/examples/*.py",
    "/scripts/render_service.py",
    "/scripts/upgrade_device.py",
    "/docs/install.md",
    "/docs/setup.md",
    "/docs/capabilities.md",
    "/docs/operations.md",
    "/docs/discovery.md",
    "/docs/permissions.md",
    "/docs/local-model.md",
    "/docs/acceptance.md",
    "/docs/publishing.md",
    "/licenses/third-party/**",
]

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.9.0", features = ["transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = "0.26.4"

[profile.release]
lto = "thin"
strip = true
