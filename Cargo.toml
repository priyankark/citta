[package]
name = "citta"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Cross-device capability sharing and task delegation for agents"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.9.0", features = ["transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = "0.26.4"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true
